[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    strict_ids: the API checks that a conversation_id the client sends is one of its own (the default in production); the other tests run with that check off
    eval: calls the real LLM providers (needs API keys and quota). None of the unit tests do; deselect with -m "not eval"
