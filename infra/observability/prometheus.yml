# Scrapes the API's /metrics (app/telemetry.py). The token is a FILE (infra/observability/metrics_token, not in git) holding the same value as
# METRICS_TOKEN in .env: `python -c "import secrets; print(secrets.token_urlsafe(32))" > infra/observability/metrics_token`
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: getnet-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]
