# One model per role. Values come from the shell or .env; these defaults are the configuration the evaluation reports
# were produced with (agents on Fireworks gpt-oss-120b, judge on Groq qwen).
# Override for a single run: LIGHT_MODEL=accounts/fireworks/models/gpt-oss-20b docker compose run --rm eval
x-models: &models
  AGENT_PROVIDER: ${AGENT_PROVIDER:-fireworks}      # fireworks or groq (agents only; the judge is always Groq)
  LLM_MODEL: ${LLM_MODEL:-accounts/fireworks/models/gpt-oss-120b}      # knowledge agent
  LIGHT_MODEL: ${LIGHT_MODEL:-accounts/fireworks/models/gpt-oss-120b}  # router, synthesizer, verifier (and support if SUPPORT_MODEL is empty)
  SUPPORT_MODEL: ${SUPPORT_MODEL:-accounts/fireworks/models/gpt-oss-120b}  # support agent
  JUDGE_MODEL: ${JUDGE_MODEL:-qwen/qwen3.8-27b}     # eval judge (different family than the agents)
  REASONING_EFFORT: ${REASONING_EFFORT:-low}

# Who may call the API. Two issuers (Keycloak realms), each with its own audience and signing keys: merchants for
# /chat and /conversations, operators for /operator/*. The ISSUER is what the token says (the address a client used to
# reach Keycloak, localhost:8180 from the host); the JWKS URL is where THIS container fetches the public keys.
x-auth: &auth
  JWKS_URL: ${JWKS_URL:-http://keycloak:8080/realms/getnet-merchants/protocol/openid-connect/certs}
  JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8180/realms/getnet-merchants}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-getnet-support-api}
  OPERATOR_JWKS_URL: ${OPERATOR_JWKS_URL:-http://keycloak:8080/realms/getnet-operators/protocol/openid-connect/certs}
  OPERATOR_JWT_ISSUER: ${OPERATOR_JWT_ISSUER:-http://localhost:8180/realms/getnet-operators}
  OPERATOR_JWT_AUDIENCE: ${OPERATOR_JWT_AUDIENCE:-getnet-operator-api}

services:
  # Identity provider for the demo (dev mode, in-memory database, realms imported from infra/keycloak). It is bound to
  # 127.0.0.1 only. A real deployment uses the company's own identity provider: only the six AUTH variables change.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env (any long random value)}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env (the password of the demo users)}
      KC_HOSTNAME: http://localhost:8180            # the issuer clients see...
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"       # ...while the API reaches it as keycloak:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"   # 8080 is often taken on a developer machine
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # the image has no curl: ask the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  api:
    build: .
    image: getnet-agents:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      <<: [*models, *auth]
      WEB_CONCURRENCY: "1"   # one worker only (rate limit and key cache in the process, conversations in one SQLite file)
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - data:/app/data   # named volume: Chroma, tickets, handoffs survive restarts (see README, Production hardening)
    restart: unless-stopped

  # one-off jobs (not started by `up`):
  #   docker compose run --rm ingest   -> build the knowledge base
  #   docker compose run --rm eval     -> run the evaluation
  ingest:
    image: getnet-agents:latest
    profiles: ["tools"]
    env_file: .env
    volumes:
      - data:/app/data
    command: ["python", "-m", "app.rag.ingest"]

  eval:
    image: getnet-agents:latest
    profiles: ["tools"]
    env_file: .env
    environment: *models
    volumes:
      - data:/app/data
      - ./eval/reports:/app/eval/reports
    command: ["python", "-m", "eval.run_eval"]

# Named volume, not a bind mount: the container runs as uid 10001 (not root), and a bind mount takes
# its permissions from the host folder (root-owned files on Docker Desktop, OneDrive in between).
# Docker creates the volume with the owner of /app/data in the image, which is that user.
volumes:
  data:
